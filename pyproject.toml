[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distribution-model-manager"
version = "4.2.23"
description = "Jeddah distribution model association and G-file graphics processing unified desktop application"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "oracledb>=2.0",
    "cryptography>=42.0",
    "paramiko>=3.4",
    "cffi>=1.16",
    "openpyxl>=3.1,<4",
    "platformdirs>=4,<5",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
distribution-model-manager = "dmm.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmm = [
    "resources/*.png",
    "resources/*.ico",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
